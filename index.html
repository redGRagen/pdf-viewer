<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Просмотр документа</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  background: #e9e9e9;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  background: #333;
  color: white;
  flex-shrink: 0;
}
button {
  padding: 8px 12px;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
button:hover { background: #ddd; }
#zoomValue {
  min-width: 54px;
  text-align: center;
  font-size: 14px;
}
#viewer {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
}
#viewer.dragging { cursor: grabbing; }
#image {
  position: absolute;
  max-width: none;
  max-height: none;
  transform-origin: 0 0;
  user-select: none;
  -webkit-user-drag: none;
  display: none;
}
#pdfFrame {
  width: 100%;
  height: 100%;
  border: 0;
  display: none;
  background: white;
}
#message {
  padding: 24px;
  text-align: center;
}
</style>
</head>
<body>

<div class="toolbar">
  <button id="minus" type="button">−</button>
  <span id="zoomValue">100%</span>
  <button id="plus" type="button">+</button>
  <button id="fit" type="button">По умолчанию</button>
  <button id="actual" type="button">100%</button>
  <button id="full" type="button">⛶ Развернуть</button>
</div>

<div id="viewer">
  <img id="image" alt="Просматриваемое изображение">
  <iframe id="pdfFrame" title="Просмотр PDF"></iframe>
  <div id="message" hidden></div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || 'document.pdf';
  const image = document.getElementById('image');
  const viewer = document.getElementById('viewer');
  const pdfFrame = document.getElementById('pdfFrame');
  const zoomValue = document.getElementById('zoomValue');
  const message = document.getElementById('message');

  let scale = 1, x = 0, y = 0;
  let startX = 0, startY = 0, dragging = false;
  let fitScale = 1;

  const isImage = /\.(jpe?g|png|gif|webp|bmp)$/i.test(file);

  if (isImage) {
    image.src = file;
    image.style.display = 'block';

    image.onload = () => {
      fitScale = Math.min(
        viewer.clientWidth / image.naturalWidth,
        viewer.clientHeight / image.naturalHeight
      );
      scale = fitScale;
      x = (viewer.clientWidth - image.naturalWidth * scale) / 2;
      y = (viewer.clientHeight - image.naturalHeight * scale) / 2;
      update();
    };

    image.onerror = () => {
      message.hidden = false;
      message.textContent = 'Не удалось загрузить изображение. Проверьте имя файла.';
    };
  } else if (/\.pdf$/i.test(file)) {
    pdfFrame.src =
      'https://mozilla.github.io/pdf.js/web/viewer.html?file=' +
      encodeURIComponent(new URL(file, location.href).href);
    pdfFrame.style.display = 'block';
    document.querySelectorAll('.toolbar button, #zoomValue')
      .forEach(el => el.style.display = 'none');
  } else {
    message.hidden = false;
    message.textContent = 'Поддерживаются JPG, PNG и PDF.';
  }

  function update() {
    image.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    zoomValue.textContent = Math.round(scale * 100) + '%';
  }

  function zoom(factor) {
    const cx = viewer.clientWidth / 2;
    const cy = viewer.clientHeight / 2;
    x = cx - (cx - x) * factor;
    y = cy - (cy - y) * factor;
    scale = Math.max(0.05, Math.min(10, scale * factor));
    update();
  }

  document.getElementById('plus').onclick = () => zoom(1.25);
  document.getElementById('minus').onclick = () => zoom(0.8);

  document.getElementById('fit').onclick = () => {
    scale = Math.min(
      viewer.clientWidth / image.naturalWidth,
      viewer.clientHeight / image.naturalHeight
    );
    x = (viewer.clientWidth - image.naturalWidth * scale) / 2;
    y = (viewer.clientHeight - image.naturalHeight * scale) / 2;
    update();
  };

  document.getElementById('actual').onclick = () => {
    scale = 1;
    x = (viewer.clientWidth - image.naturalWidth) / 2;
    y = (viewer.clientHeight - image.naturalHeight) / 2;
    update();
  };

  document.getElementById('full').onclick = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  };

  viewer.addEventListener('pointerdown', e => {
    if (!isImage || e.target !== image) return;
    dragging = true;
    startX = e.clientX - x;
    startY = e.clientY - y;
    viewer.classList.add('dragging');
    viewer.setPointerCapture(e.pointerId);
  });

  viewer.addEventListener('pointermove', e => {
    if (!dragging) return;
    x = e.clientX - startX;
    y = e.clientY - startY;
    update();
  });

  function stopDrag() {
    dragging = false;
    viewer.classList.remove('dragging');
  }
  viewer.addEventListener('pointerup', stopDrag);
  viewer.addEventListener('pointercancel', stopDrag);

  viewer.addEventListener('wheel', e => {
    if (!isImage) return;
    e.preventDefault();
    const oldScale = scale;
    scale = Math.max(0.05, Math.min(10,
      scale * (e.deltaY < 0 ? 1.12 : 0.89)
    ));
    const rect = viewer.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    x = mx - (mx - x) * scale / oldScale;
    y = my - (my - y) * scale / oldScale;
    update();
  }, { passive: false });

  window.addEventListener('resize', () => {
    if (isImage && image.complete && image.naturalWidth) {
      document.getElementById('fit').click();
    }
  });
})();
</script>
</body>
</html>
